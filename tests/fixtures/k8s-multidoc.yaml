# A Kubernetes-style multi-document manifest bundle.
---
apiVersion: v1
kind: Namespace
metadata:
  name: yayl-demo
  labels:
    app.kubernetes.io/part-of: demo
---
# Deployment for the API server
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: yayl-demo
spec:
  replicas: 3
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: ghcr.io/example/api:1.4.2
          ports:
            - containerPort: 8080
          env:
            - name: LOG_LEVEL
              value: info
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: api-db
                  key: url
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: yayl-demo
spec:
  selector:
    app: api
  ports:
    - port: 80
      targetPort: 8080
...

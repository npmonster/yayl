# yayl CI — pinned to the exact Zig version the library targets.
# Every compiler, formatter and test-runner diagnostic is a failure:
# the commands below exit non-zero on any error, and Zig 0.16 promotes
# most warnings to errors on its own.
name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: zig version
        run: zig version

      - name: Format check
        run: zig fmt --check build.zig build.zig.zon src tests examples

      - name: Compile the library (analyse the public root)
        run: zig build check --summary all

      - name: Build examples
        run: zig build examples

      - name: Unit tests (Debug, leak-checked)
        run: zig build test --summary all

      - name: Unit tests (ReleaseSafe)
        run: zig build test -Doptimize=ReleaseSafe --summary all

      - name: Cross-target compile (x86_64-linux)
        run: zig build check -Dtarget=x86_64-linux

      - name: Cross-target compile (aarch64-linux)
        run: zig build check -Dtarget=aarch64-linux

      - name: Fetch pinned YAML Test Suite corpus
        run: make corpus

      - name: Conformance corpus
        run: zig build conformance --summary all

      - name: Round-trip gate (byte-faithful emit(parse(x)) == x)
        run: zig build roundtrip --summary all

      - name: Edit-preservation sweeps (edits change only what they should)
        run: zig build preservation --summary all

      - name: Differential gate (event parity vs libfyaml)
        run: make differential

      - name: Assert gates are not vacuous
        run: |
          passes=$(grep -c '"status": "pass"' zig-out/conformance-report.json)
          echo "conformance passes: $passes"
          test "$passes" -ge 300

      - name: Upload conformance report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: conformance-report
          path: zig-out/conformance-report.json

  # The in-tree gates above all build from the working tree, so they
  # cannot see the one failure mode that breaks every dependent while
  # staying green here: a source file missing from `.paths` in
  # build.zig.zon. `zig fetch` on a directory runs the real packaging
  # path -- it applies `.paths` and produces the same content-hashed
  # tarball a `zig fetch --save git+https://...` would -- so building a
  # throwaway package against this checkout reproduces exactly what a
  # downstream project gets. No network and no pushed commit required,
  # so this also works on pull requests from forks.
  consume:
    name: Consume as a dependency
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Build a fresh consumer against this checkout
        run: sh scripts/consumer-smoke.sh

  # A tag is permanent and the package hash is content-addressed, so a
  # tag whose name disagrees with build.zig.zon cannot be corrected in
  # place -- it can only be superseded by another release. Catch the
  # mismatch while it is still just a tag push.
  tag-version-match:
    name: Tag matches build.zig.zon version
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - name: Assert tag == .version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          zon=$(sed -n 's/^[[:space:]]*\.version = "\([^"]*\)".*/\1/p' build.zig.zon)
          echo "tag version:          $tag"
          echo "build.zig.zon version: $zon"
          if [ "$tag" != "$zon" ]; then
            echo "::error::tag $GITHUB_REF_NAME disagrees with build.zig.zon .version = \"$zon\""
            exit 1
          fi

  # The gates above run only on ubuntu-x64. A YAML library is exactly the
  # kind of code where that is not enough: the scanner has to deal with
  # CRLF, and src/file.zig's atomic write (temp + fsync + rename) has
  # genuinely different semantics on Windows, where renaming onto an
  # existing file is not the same call it is on POSIX.
  #
  # Runs the portable core only. `fmt` is platform-independent and the
  # differential gate needs a C toolchain plus a libfyaml build, so both
  # stay on the Linux job rather than being reproduced badly here.
  #
  # macos-13 (Intel) was in this matrix and is deliberately not: GitHub is
  # retiring the Intel macOS runners, and in practice the job sat queued
  # without ever being scheduled, backing up every subsequent run behind
  # it. A gate that cannot be scheduled is not a gate. macos-latest
  # (arm64) covers macOS; the Intel-specific surface is nil for pure Zig
  # with no SIMD or assembly.
  #
  # core.autocrlf is forced off BEFORE checkout: git on Windows would
  # otherwise rewrite the fixtures' line endings, and a byte-exact
  # round-trip gate compared against rewritten fixtures tests nothing.
  # Any CRLF handling we assert should come from the corpus, not the
  # checkout.
  platform:
    name: ${{ matrix.os }}
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      - name: Do not rewrite line endings on checkout
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v5

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: zig version
        run: zig version

      - name: Compile the library (analyse the public root)
        run: zig build check --summary all

      - name: Unit tests (Debug, leak-checked)
        run: zig build test --summary all

      - name: Unit tests (ReleaseSafe)
        run: zig build test -Doptimize=ReleaseSafe --summary all

      - name: Fetch pinned YAML Test Suite corpus
        run: sh scripts/fetch-corpus.sh

      - name: Conformance corpus
        run: zig build conformance --summary all

      - name: Round-trip gate (byte-faithful emit(parse(x)) == x)
        run: zig build roundtrip --summary all

      - name: Edit-preservation sweeps (edits change only what they should)
        run: zig build preservation --summary all
